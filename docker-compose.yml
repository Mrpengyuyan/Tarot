version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tarot_postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tarot_fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data:ro
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: tarot_frontend_app
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
    name: tarot_postgres_data
  frontend_node_modules:
    name: tarot_frontend_node_modules
